<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176451">
  <meta name="description" content="新增報修需求，查看最近的處理進度。">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <div class="header-inner"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">＋</span>報修登記</a><span class="header-note">讓每個問題，都有紀錄。</span></div>
  </header>
  <main id="main" class="container">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">REPAIR DESK</p>
      <h1 id="page-title">需要協助嗎？<br>把問題交給我們。</h1>
      <p>填寫報修需求，並在下方查看最新的處理進度。</p>
      <p class="demo-note">示範系統・清單公開，請僅填寫虛構姓名與地點。</p>
      <p><a href="./文件/報修登記系統提案.pptx" download>下載提案簡報（PowerPoint，6 頁）</a></p>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><div><p class="eyebrow">01 / NEW REQUEST</p><h2 id="form-title">新增報修</h2></div><span class="subtle">所有欄位皆為必填</span></div>
      <noscript><p class="message error">請啟用 JavaScript，才能送出報修及查看清單。</p></noscript>
      <form id="repair-form">
        <fieldset id="form-fields" disabled>
          <div class="form-grid">
            <div class="field"><label for="reporter-name">報修人</label><input id="reporter-name" name="reporter_name" required maxlength="100" autocomplete="off" placeholder="例如：示範同事甲"></div>
            <div class="field"><label for="location">地點或部門</label><input id="location" name="location" required maxlength="200" autocomplete="off" placeholder="例如：虛構園區 A 棟"></div>
            <div class="field"><label for="category">類別</label><select id="category" name="category" required><option value="" disabled selected>請選擇問題類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></div>
            <div class="field"><label for="urgency">緊急程度</label><select id="urgency" name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></div>
            <div class="field full-width"><label for="description">問題說明</label><textarea id="description" name="description" required maxlength="2000" rows="5" placeholder="請描述遇到的問題，以及需要協助的事項。" aria-describedby="description-help"></textarea><span id="description-help" class="subtle">最多 2,000 字，請勿填寫個人敏感資訊。</span></div>
          </div>
          <div class="form-footer"><span class="subtle">送出後，案件會以「待處理」登記。</span><button id="submit-button" type="submit">送出報修 <span aria-hidden="true">↗</span></button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" aria-atomic="true" hidden></p>
    </section>

    <section class="requests-section" aria-labelledby="list-title">
      <div class="section-heading"><div><p class="eyebrow">02 / RECENT REQUESTS</p><h2 id="list-title">最近報修</h2><p class="subtle">最新 20 筆・依登記時間由新到舊</p></div><button id="refresh-button" class="secondary" type="button" disabled>重新整理</button></div>
      <div id="urgency-filters" class="urgency-filters" role="group" aria-label="依緊急程度篩選">
        <button type="button" data-urgency="全部" aria-pressed="true" aria-controls="request-list">全部</button>
        <button type="button" data-urgency="高" aria-pressed="false" aria-controls="request-list">高</button>
        <button type="button" data-urgency="中" aria-pressed="false" aria-controls="request-list">中</button>
        <button type="button" data-urgency="低" aria-pressed="false" aria-controls="request-list">低</button>
      </div>
      <p id="filter-summary" class="subtle" role="status" aria-live="polite" hidden></p>
      <p id="list-message" class="message" role="status" aria-live="polite" aria-atomic="true">正在連線，載入報修清單…</p>
      <ul id="request-list" class="request-list" aria-label="最近報修清單" aria-busy="true"></ul>
    </section>
  </main>
  <footer class="site-footer">報修登記 <span aria-hidden="true">／</span> 一起讓工作環境更好。</footer>
</body>
</html>
